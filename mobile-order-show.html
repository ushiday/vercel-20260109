<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC Coffee - Order Status</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8f5f2;
      padding: 20px;
      color: #4e342e;
    }

    /* Chrome, Safari, Edge, Opera 用（スピンボタンを消す） */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Firefox 用 */
    input[type=number] {
      -moz-appearance: textfield;
    }

    .order-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      margin: auto;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.5rem;
      color: #6d4c41;
      border-bottom: 2px solid #d7ccc8;
      padding-bottom: 10px;
    }

    .logo {
      width: 35px;
      height: 35px;
    }

    .section {
      margin-bottom: 20px;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    label.title {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #8d6e63;
    }

    .input-item {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .button-order {
      width: 100%;
      padding: 15px;
      background-color: #6d4c41;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 照会画面独自のスタイル */
    .result-area {
      display: none;
      /* 最初は隠しておく */
      background-color: #fffaf0;
      border: 2px dashed #d7ccc8;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
    }

    /* 注文確定のバッジ */
    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      background-color: dodgerblue;
      color: white;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: bolder;
      margin-bottom: 10px;
    }

    /* モーダル用）画面全体を覆う背景 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      /* 半透明の黒 */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* モーダル用）中央の白いカード */
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 80%;
      max-width: 350px;
      /* ふわっと出すアニメーション */
      animation: fadeIn 0.3s;
    }

    /* モーダル用）ボタン */
    .modal-content button {
      margin-top: 20px;
      background-color: #6d4c41;
    }

    /* エラー時のヘッダー色 */
    .modal-content.error-mode h2 {
      color: #d32f2f;
      /* 警告の赤 */
    }

    /* エラー時のボタン色 */
    .modal-content.error-mode button {
      background-color: #d32f2f;
    }

    /* モーダル用）アニメーション */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* フォームの未入力箇所を赤枠にする */
    .invalid-input {
      border: 2px solid #d32f2f !important;
    }
  </style>
</head>

<body>

  <div class="order-card">
    <h1>
      <img src="./img/coffee-1.png" alt="Logo" class="logo">
      ご注文内容
    </h1>

    <div class="section">
      <label class="title">注文番号を入力してください</label>
      <input type="number" id="searchOrderNo" class="input-item" placeholder="例：1769414329169">
      <button class="button-order" onclick="searchOrder()">🔍 注文を検索する</button>
    </div>

    <div id="resultArea" class="result-area" style="display: none;">
      <div id="resultContent"></div>
      <button class="button-order" style="background-color: #8d6e63;" onclick="location.reload()">別の番号を検索</button>
    </div>

    <div id="orderModal" class="modal-overlay" style="display: none;">
      <div class="modal-content error-mode">
        <h2>該当なし</h2>
        <div id="modalDetails"></div>
        <button class="button-order" onclick="closeModal()">閉じる</button>
      </div>
    </div>

  </div>

  <script>

    /**
     * 注文番号から検索し、詳細を表示する
     **/
    function searchOrder() {
      const searchNo = document.getElementById('searchOrderNo').value.trim();
      const resultArea = document.getElementById('resultArea');
      const resultContent = document.getElementById('resultContent');

      // 結果を非表示
      resultArea.style.display = 'none';

      // モーダル関連の取得
      const modal = document.getElementById('orderModal');
      const modalDetails = document.getElementById('modalDetails');

      // モーダル非表示
      modal.style.display = 'none';

      // 1. 未入力チェック
      if (searchNo === "") {
        showError("注文番号を入力してください。");
        return;
      }

      // 2. データの取得と検索
      const orderListJson = localStorage.getItem('orderList');
      if (!orderListJson) {
        showError("注文データがまだありません。");
        return;
      }

      const orderList = JSON.parse(orderListJson);
      const foundOrder = orderList.find(row => String(row.orderNo) === String(searchNo));

      // 3. 検索結果の判定
      if (!foundOrder) {
        showError("該当する注文番号が見つかりませんでした。");
        return;
      }

      // --- 4. 正常系：出力項目の構築（柴田さんの指定通り） ---
      resultArea.style.display = 'block';
      let html = '';

      // ステータス・バッジ
      html += `<div class="status-badge">注文確定済み</div>`;

      html += `<h4 style="font-size: 1.1rem; font-weight: bold; margin-bottom:10px;">オーダー№：${foundOrder.orderNo}</h4>`;
      html += `<p style="font-size: 1.1rem; font-weight: bold; margin:2px 0;">ニックネーム：${foundOrder.customerName}</p>`;
      html += `<p style="font-size: 1rem; font-weight: bold; margin:2px 0;">受取：${foundOrder.shop}</p>`;

      // ドリンクの表示
      if (foundOrder.drink) {
        html += `<p style="font-size: 1.1rem; font-weight: bold; margin-top:10px; margin-bottom:0;">ドリンク：${foundOrder.drink} (${foundOrder.size})</p>`;

        // カスタマイズリストのループ
        if (foundOrder.custmizeList && foundOrder.custmizeList.length > 0) {
          for (const custom of foundOrder.custmizeList) {
            html += `<p style="font-size: 0.9rem; margin:0; color: #555;"> - ${custom} </p>`;
          }
        }
      }

      // フードの表示
      if (foundOrder.food) {
        html += `<p style="font-size: 1.1rem; font-weight: bold; margin-top:10px;">フード：${foundOrder.food}</p>`;
      }

      // 合計金額（カンマ区切りは保存時の形式に依存しますが、ここで整形も可能）
      html += `<p style="color: #bf360c; font-size: 1.5rem; font-weight: bold; border-top: 1px solid #d7ccc8; padding-top:10px; margin-top:15px;">合計：¥${foundOrder.total}</p>`;

      resultContent.innerHTML = html;
    }

    /**
     * エラーをモーダルで表示する
     **/
    function showError(message) {
      const modal = document.getElementById('orderModal');
      const modalDetails = document.getElementById('modalDetails');

      modalDetails.innerHTML = `<p>${message}</p>`;
      modal.style.display = 'flex';
    }

    /**
     * モーダルを閉じる
     **/
    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }
  </script>

</body>

</html>
